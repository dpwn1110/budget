<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<title>엄마 가계부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 엄마 가계부: Numbers에서 쓰던 수입·지출·잔액 표를 한 화면에 나란히 */
:root{
  --bg:#E4E3E8; --blob1:rgba(255,170,150,.45); --blob2:rgba(160,184,214,.5); --blob3:rgba(255,255,255,.7);
  --panel:rgba(255,255,255,.5); --card:rgba(255,255,255,.75); --soft:rgba(255,255,255,.55);
  --glass-line:rgba(255,255,255,.75); --blur:saturate(160%) blur(22px);
  --ink:#121316; --sub:#6A6F79; --line:rgba(18,19,22,.10);
  --in:#1E9E52; --in-soft:rgba(46,191,110,.16);
  --out:#E5432F; --out-soft:rgba(240,80,60,.13);
  --bal:#1F7AE0; --bal-soft:rgba(40,130,240,.14);
  --hl:#FFB4A0; --hl-ink:#2A100A;
  --pop:rgba(248,248,250,.97);
  --shadow:0 8px 32px rgba(40,52,70,.08);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E0F12; --blob1:rgba(255,150,125,.12); --blob2:rgba(90,110,150,.22); --blob3:rgba(255,255,255,.03);
  --panel:rgba(32,34,40,.55); --card:rgba(255,255,255,.08); --soft:rgba(255,255,255,.06);
  --glass-line:rgba(255,255,255,.08);
  --ink:#F2F3F5; --sub:#9A9FA9; --line:rgba(255,255,255,.10);
  --in:#4CD38A; --in-soft:rgba(76,211,138,.14);
  --out:#FF7B6B; --out-soft:rgba(255,123,107,.14);
  --bal:#6AAEFF; --bal-soft:rgba(106,174,255,.14);
  --hl:#FF9F86;
  --pop:rgba(30,32,38,.97);
  --shadow:0 8px 32px rgba(0,0,0,.3);
}}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);background-color:var(--bg);
  background-image:radial-gradient(42vw 42vw at 8% 0%,var(--blob1),transparent 70%),radial-gradient(48vw 48vw at 100% 30%,var(--blob2),transparent 70%),radial-gradient(40vw 40vw at 40% 100%,var(--blob3),transparent 70%);
  background-attachment:fixed;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.45;letter-spacing:-.01em;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(40px + env(safe-area-inset-bottom,0px))}
.glass{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shadow),inset 0 0 0 1px var(--glass-line);border-radius:24px}
.num{white-space:nowrap}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-.04em}
.brand i{width:28px;height:28px;border-radius:9px;background:var(--ink);color:var(--hl);display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:900}
.tools{display:flex;gap:6px}
.iconBtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-line);background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);display:grid;place-items:center;position:relative}
.iconBtn svg{width:19px;height:19px}
.iconBtn:disabled{opacity:.35;cursor:default}
.iconBtn.alert::after{content:"";position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--out);box-shadow:0 0 0 2px var(--bg)}

/* 합계 */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:6px;margin-bottom:12px}
.sum>div{padding:12px 14px;border-radius:18px;min-width:0}
.sum span{display:block;font-size:13.5px;font-weight:600;color:var(--sub)}
.sum b{display:block;font-size:clamp(17px,5vw,24px);font-weight:800;letter-spacing:-.04em;white-space:nowrap}
.sIn b{color:var(--in)} .sOut b{color:var(--out)}
.sBal{grid-column:1/-1;background:var(--bal-soft);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.sBal span{color:var(--bal)}
.sBal b{font-size:clamp(24px,7.5vw,34px);color:var(--bal)}
.sBal b.neg{color:var(--out)}

/* 수입 | 지출 나란히 */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.col{padding:0 0 4px;overflow:hidden;min-width:0}
.colHead{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:12px 12px 10px 14px;border-bottom:1px solid var(--line)}
.colHead h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:7px}
.colHead h2::before{content:"";width:10px;height:10px;border-radius:3px;background:currentColor}
.in .colHead h2{color:var(--in)} .out .colHead h2{color:var(--out)}
.addBtn{border:0;border-radius:999px;padding:7px 12px;font-weight:700;font-size:14.5px;white-space:nowrap}
.in .addBtn{background:var(--in);color:#fff} .out .addBtn{background:var(--out);color:#fff}
.rows{list-style:none;margin:0;padding:4px 6px}
.row{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 8px;border-radius:14px;border-bottom:1px solid var(--line)}
.rows li:last-child .row{border-bottom:0}
.row:hover{background:var(--card)}
.row .t{display:block;font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:1px}
.row .d{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-weight:700;font-size:15.5px;letter-spacing:-.03em;white-space:nowrap;margin-left:auto}
.row.carry .t::after{content:"이월";margin-left:5px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);color:var(--sub);vertical-align:1px}
.empty{color:var(--sub);font-size:14px;padding:18px 10px;text-align:center}
.colFoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 6px;margin:4px 6px 0;padding:11px 10px;border-radius:14px}
.colFoot b{margin-left:auto}
.in .colFoot{background:var(--in-soft)} .out .colFoot{background:var(--out-soft)}
.colFoot span{font-size:13.5px;font-weight:700;white-space:nowrap}
.colFoot b{font-size:16px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.in .colFoot b{color:var(--in)} .out .colFoot b{color:var(--out)}

/* 그래프 */
.chart{margin-top:12px;padding:16px}
.chartHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chartHead h2{margin:0;font-size:18px;font-weight:800}
.seg{display:inline-flex;gap:4px}
.seg button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chartBody{display:flex;align-items:center;gap:18px}
.donut{width:min(44%,220px);flex:none;aspect-ratio:1}
.donut text{font-family:inherit}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:0}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.legend li:last-child{border-bottom:0}
.legend i{width:12px;height:12px;border-radius:4px}
.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-weight:700;white-space:nowrap}
.legend small{color:var(--sub);font-weight:500;margin-left:5px}
@media (max-width:520px){.chartBody{flex-direction:column;align-items:stretch}.donut{width:min(70%,240px);margin:0 auto}}

/* 넓은 화면: 그래프를 오른쪽에 */
@media (min-width:980px){
  .wrap{padding-left:24px;padding-right:24px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
  .chart{margin-top:0;position:sticky;top:16px}
  .chartBody{flex-direction:column;align-items:stretch}
  .donut{width:220px;margin:0 auto}
}
@media (max-width:400px){
  .wrap{padding-left:10px;padding-right:10px}
  .cols{gap:8px}
  .colHead{padding:10px 8px 8px 10px}
  .colHead h2{font-size:16.5px}
  .addBtn{padding:6px 10px;font-size:13.5px}
  .rows{padding:3px 3px}
  .row{padding:8px 6px}
  .row .t,.row .a{font-size:14.5px}
}

/* 입력 시트 */
.sheet{border:0;padding:0;margin:auto auto 0;width:min(520px,100%);max-height:92vh;border-radius:26px 26px 0 0;background:var(--bg);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media (min-width:640px){.sheet{margin:auto;border-radius:26px}}
.sheet::backdrop{background:rgba(10,12,18,.4)}
.sheetIn{padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheetHead h2{margin:0;font-size:20px;font-weight:800}
.typeSeg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.typeSeg button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 0;font-weight:700;font-size:16px;color:var(--sub)}
.typeSeg button[data-t="in"][aria-pressed="true"]{background:var(--in);border-color:var(--in);color:#fff}
.typeSeg button[data-t="out"][aria-pressed="true"]{background:var(--out);border-color:var(--out);color:#fff}
.amountBox{display:flex;align-items:baseline;gap:6px;background:var(--card);border-radius:18px;padding:12px 16px;box-shadow:inset 0 0 0 1px var(--line)}
.amountBox:focus-within{box-shadow:inset 0 0 0 2px var(--ink)}
.amountBox span{font-size:20px;font-weight:700;color:var(--sub)}
.amountBox input{border:0;background:transparent;font-size:32px;font-weight:800;letter-spacing:-.045em;width:100%;min-width:0;padding:0;outline:none;text-align:right}
.amountBox input::placeholder{color:var(--sub);opacity:.35}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.quick button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.field label{font-size:14px;color:var(--sub);font-weight:600;padding-left:4px}
.field input,.pickBtn{width:100%;border:0;background:var(--card);border-radius:14px;padding:12px 14px;min-height:52px;font-size:16px;font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.field input:focus{outline:2px solid var(--ink);outline-offset:0}
.pickBtn{display:flex;align-items:center;justify-content:space-between;text-align:left}
.pickBtn svg{width:18px;height:18px;color:var(--sub)}
.pickBtn .ph{color:var(--sub)}
.memoChips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.memoChips button{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:600;color:var(--sub)}
.sheetBtns{display:flex;gap:8px;margin-top:16px}
.sheetBtns button{min-height:56px;border-radius:999px;font-weight:700;font-size:17px;border:1px solid var(--line);background:var(--card)}
.sheetBtns .save{flex:1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheetBtns .delete{color:var(--out);padding:0 18px}
.sheetBtns .cancel{padding:0 20px}
.sheetBtns [hidden]{display:none}

/* 메뉴 (백업) */
.menuList{display:flex;flex-direction:column;gap:8px}
.menuList button{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;font-size:16px;font-weight:600;text-align:left;display:flex;justify-content:space-between;align-items:center}
.menuList small{color:var(--sub);font-weight:500;font-size:13px}
.note{color:var(--sub);font-size:14px;margin:12px 4px 0;line-height:1.5}
.note.warn{color:var(--out)}

/* 날짜 고르기 */
.picker{position:fixed;z-index:30;width:300px;max-width:calc(100vw - 16px);padding:14px;border-radius:22px;background:var(--pop);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 18px 50px rgba(20,24,36,.25),inset 0 0 0 1px var(--glass-line);color:var(--ink)}
.picker[hidden]{display:none}
.pkHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pkHead b{font-size:16px;font-weight:700}
.pkHead button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.pkHead svg{width:16px;height:16px}
.pkWeek,.pkGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pkWeek span{text-align:center;font-size:12px;font-weight:600;color:var(--sub);padding:2px 0 4px}
.pkWeek span:first-child,.pkGrid .sun{color:var(--out)}
.pkGrid button{aspect-ratio:1;border:0;background:transparent;border-radius:50%;font-size:14.5px;font-weight:600;padding:0;color:var(--ink)}
.pkGrid button:hover{background:var(--card)}
.pkGrid .today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.pkGrid .sel,.pkGrid .sel:hover{background:var(--ink);color:var(--bg)}
.pkFoot{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pkFoot button{flex:1;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 0;font-size:14px;font-weight:600}

.toast{position:fixed;left:50%;transform:translate(-50%,8px);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:40;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 인쇄·PDF: 흑백, 수입·지출 표 나란히 */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important;color:#000;font-size:11px}
  .tools,.addBtn,.chart .seg,.toast{display:none!important}
  .glass{background:#fff!important;box-shadow:none!important;-webkit-backdrop-filter:none;backdrop-filter:none;border:1px solid #bbb;border-radius:8px}
  .wrap{padding:0;max-width:none}
  .layout{display:block}
  .sBal{background:#eee!important}
  .sIn b,.sOut b,.sBal b,.sBal span,.colFoot b,.in .colHead h2,.out .colHead h2{color:#000!important}
  .colFoot{background:#eee!important}
  .row{padding:4px 6px;break-inside:avoid}
  .chart{break-inside:avoid;margin-top:10px}
  .donut{width:150px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i>₩</i>엄마 가계부</div>
    <div class="tools">
      <button class="iconBtn" id="undoBtn" aria-label="되돌리기" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3 2.5 6l3 3"/><path d="M2.5 6h7a4 4 0 0 1 0 8H7"/></svg></button>
      <button class="iconBtn" id="pdfBtn" aria-label="PDF로 저장·인쇄"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5h7l3 3v12H5z"/><path d="M8 10.5h4M8 13.5h4"/></svg></button>
      <button class="iconBtn" id="menuBtn" aria-label="백업" aria-haspopup="dialog"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
    </div>
  </header>

  <section class="sum glass" aria-live="polite">
    <div class="sIn"><span>수입 총액</span><b id="sumIn">₩0</b></div>
    <div class="sOut"><span>지출 총액</span><b id="sumOut">₩0</b></div>
    <div class="sBal"><span>잔액<br><small style="font-weight:500">수입 − 지출</small></span><b id="bal">₩0</b></div>
  </section>

  <div class="layout">
    <div class="cols">
      <section class="col in glass" aria-labelledby="inTitle">
        <div class="colHead"><h2 id="inTitle">수입</h2><button type="button" class="addBtn" data-add="in">+ 추가</button></div>
        <ol class="rows" id="listIn"></ol>
        <div class="colFoot"><span>수입 총액</span><b id="footIn">₩0</b></div>
      </section>
      <section class="col out glass" aria-labelledby="outTitle">
        <div class="colHead"><h2 id="outTitle">지출</h2><button type="button" class="addBtn" data-add="out">+ 추가</button></div>
        <ol class="rows" id="listOut"></ol>
        <div class="colFoot"><span>지출 총액</span><b id="footOut">₩0</b></div>
      </section>
    </div>

    <section class="chart glass" aria-labelledby="chartTitle">
      <div class="chartHead"><h2 id="chartTitle">지출</h2>
        <div class="seg" role="group" aria-label="그래프 고르기"><button type="button" data-c="out" aria-pressed="true">지출</button><button type="button" data-c="in" aria-pressed="false">수입</button></div>
      </div>
      <div class="chartBody"><svg class="donut" id="donut" viewBox="0 0 120 120" role="img"></svg><ul class="legend" id="legend"></ul></div>
    </section>
  </div>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheetIn">
    <div class="sheetHead"><h2 id="sheetTitle">추가</h2></div>
    <div class="typeSeg" role="group" aria-label="종류"><button type="button" data-t="in" aria-pressed="false">수입</button><button type="button" data-t="out" aria-pressed="true">지출</button></div>
    <label class="sr" for="fAmt">금액</label>
    <div class="amountBox"><span>₩</span><input id="fAmt" type="text" inputmode="numeric" autocomplete="off" placeholder="0"></div>
    <div class="quick" id="quick"><button type="button" data-q="100000">+10만</button><button type="button" data-q="1000000">+100만</button><button type="button" data-q="10000000">+1000만</button><button type="button" data-q="0">지우기</button></div>
    <div class="field"><label for="fMemo">내용</label><input id="fMemo" type="text" maxlength="40" placeholder="예: 루가메디컬, 상품권">
      <div class="memoChips"><button type="button" data-memo="전월이월">전월이월</button></div></div>
    <div class="field"><label for="fDateBtn">날짜 (선택)</label><button type="button" class="pickBtn" id="fDateBtn" aria-haspopup="dialog" aria-expanded="false"><span></span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2.5" y="3.5" width="11" height="10" rx="2.5"/><path d="M2.5 7h11M5.5 2v3M10.5 2v3"/></svg></button></div>
    <div class="sheetBtns"><button type="button" class="delete" id="fDel" hidden>삭제</button><button type="button" class="cancel" id="fCancel">취소</button><button type="button" class="save" id="fSave">저장</button></div>
  </div>
</dialog>

<dialog class="sheet" id="menu" aria-labelledby="menuTitle">
  <div class="sheetIn">
    <div class="sheetHead"><h2 id="menuTitle">백업</h2></div>
    <div class="menuList">
      <button type="button" id="exportBtn">백업 파일 저장 <small>.json</small></button>
      <button type="button" id="csvBtn">엑셀·Numbers용으로 저장 <small>.csv</small></button>
      <button type="button" id="importBtn">백업 불러오기 <small>.json</small></button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <p class="note" id="bkNote"></p>
    <p class="note">이 휴대폰(이 브라우저)에만 저장돼요. 방문 기록이나 사이트 데이터를 지우면 함께 지워지니 가끔 백업해 두세요.</p>
    <div class="sheetBtns"><button type="button" class="save" id="menuClose">닫기</button></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const LS='mom-gagyebu-v1';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const WD=['일','월','화','수','목','금','토'];
const won=n=>(n<0?'-':'')+'₩'+Math.abs(Math.round(n)).toLocaleString('ko-KR');
const num=s=>Number(String(s).replace(/[^\d]/g,''))||0;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmtDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>fmtDate(new Date());
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- 저장 ---------- */
let state={rows:[],lastBackup:0};
function load(){try{const r=localStorage.getItem(LS);if(r){const p=JSON.parse(r);state.rows=Array.isArray(p.rows)?p.rows:[];state.lastBackup=p.lastBackup||0}}catch(e){toast('저장된 데이터를 읽지 못했어요. 백업 파일이 있으면 불러와 주세요.')}}
function write(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){toast('이 브라우저에서는 저장이 안 돼요.')}}
let undoStack=[],last=null;
function snap(){return JSON.stringify(state.rows)}
function save(){const now=snap();if(last!==null&&now!==last){undoStack.push(last);if(undoStack.length>100)undoStack.shift()}last=now;write();$('undoBtn').disabled=!undoStack.length}
$('undoBtn').onclick=()=>{if(!undoStack.length)return;state.rows=JSON.parse(undoStack.pop());last=snap();write();$('undoBtn').disabled=!undoStack.length;render();toast('되돌렸어요')};

/* ---------- 그리기 ---------- */
function dateText(v,short){
  if(!v)return '';const d=new Date(v+'T00:00'),n=new Date();
  const y=d.getFullYear()!==n.getFullYear()?(short?String(d.getFullYear()).slice(2)+'.':d.getFullYear()+'년 '):'';
  return short?`${y}${d.getMonth()+1}.${d.getDate()}`:`${y}${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
}
// Numbers처럼 날짜순, 날짜 없는 줄(전월이월 등)은 맨 위
function sorted(type){return state.rows.filter(r=>r.type===type).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.at-b.at)}
function total(type){return state.rows.filter(r=>r.type===type).reduce((s,r)=>s+r.amount,0)}
function renderList(type,el){
  const rows=sorted(type);
  el.innerHTML=rows.length?rows.map(r=>{
    const title=r.memo||dateText(r.date)||'(내용 없음)';
    const sub=r.memo&&r.date?dateText(r.date,true):'';
    return `<li><button type="button" class="row${/이월/.test(r.memo||'')?' carry':''}" data-id="${esc(r.id)}" aria-label="${esc(title)} ${won(r.amount)} 고치기"><span class="t">${esc(title)}</span><span class="m"><span class="d">${esc(sub)}</span><span class="a">${won(r.amount)}</span></span></button></li>`;
  }).join(''):`<li class="empty">${type==='in'?'수입':'지출'}을 추가해 보세요</li>`;
}
let chartType='out';
const PAL=['#FF8A70','#3D8BFF','#2EBF6E','#F5B400','#B06CF0','#20B8C4','#9AA0AA'];
function renderChart(){
  const rows=sorted(chartType).filter(r=>r.amount>0).sort((a,b)=>b.amount-a.amount);
  const sum=rows.reduce((s,r)=>s+r.amount,0);
  $('chartTitle').textContent=chartType==='out'?'지출':'수입';
  let parts=rows.slice(0,6).map(r=>({name:r.memo||dateText(r.date)||'(내용 없음)',v:r.amount}));
  if(rows.length>6)parts.push({name:`나머지 ${rows.length-6}건`,v:rows.slice(6).reduce((s,r)=>s+r.amount,0)});
  const svg=$('donut');
  if(!sum){svg.innerHTML='<circle cx="60" cy="60" r="44" fill="none" stroke="var(--line)" stroke-width="20"/>';$('legend').innerHTML='<li style="display:block;color:var(--sub)">아직 없어요</li>';return}
  const R=44,C=2*Math.PI*R;let off=0,h='';
  parts.forEach((p,i)=>{const len=p.v/sum*C;h+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${PAL[i]}" stroke-width="20" stroke-dasharray="${Math.max(0,len-.6).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;off+=len});
  h+=`<text x="60" y="57" text-anchor="middle" font-size="9" fill="var(--sub)">${chartType==='out'?'지출':'수입'} 총액</text><text x="60" y="71" text-anchor="middle" font-size="${sum>=1e8?10:11.5}" font-weight="800" fill="var(--ink)">${won(sum)}</text>`;
  svg.innerHTML=h;svg.setAttribute('aria-label',`${chartType==='out'?'지출':'수입'} 비율 그래프`);
  $('legend').innerHTML=parts.map((p,i)=>`<li><i style="background:${PAL[i]}"></i><span>${esc(p.name)}</span><b>${Math.round(p.v/sum*100)}%<small>${won(p.v)}</small></b></li>`).join('');
}
function render(){
  const ti=total('in'),to=total('out'),b=ti-to;
  $('sumIn').textContent=$('footIn').textContent=won(ti);
  $('sumOut').textContent=$('footOut').textContent=won(to);
  $('bal').textContent=won(b);$('bal').classList.toggle('neg',b<0);
  renderList('in',$('listIn'));renderList('out',$('listOut'));
  renderChart();
  const lb=state.lastBackup,note=$('bkNote');
  if(!state.rows.length){note.textContent='';note.classList.remove('warn')}
  else if(!lb){note.textContent='아직 백업한 적이 없어요.';note.classList.add('warn')}
  else{const d=Math.floor((Date.now()-lb)/864e5);note.textContent=d===0?'오늘 백업했어요.':`마지막 백업: ${d}일 전`;note.classList.toggle('warn',d>=14)}
  $('menuBtn').classList.toggle('alert',note.classList.contains('warn'));
}
document.querySelector('.chart .seg').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;chartType=b.dataset.c;document.querySelectorAll('.chart .seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderChart()});

/* ---------- 날짜 고르기 ---------- */
let fDate='';
function showDate(){const sp=$('fDateBtn').querySelector('span');sp.textContent=fDate?dateText(fDate):'날짜 없음';sp.classList.toggle('ph',!fDate)}
const picker=document.createElement('div');picker.className='picker';picker.hidden=true;picker.setAttribute('role','dialog');picker.setAttribute('aria-label','날짜 고르기');
let pk=null;
const ARW=d=>`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
function drawPicker(){
  const {y,m}=pk,first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),ts=todayStr();
  let g='<span></span>'.repeat(first.getDay());
  for(let d=1;d<=days;d++){const dt=new Date(y,m,d),ds=fmtDate(dt);g+=`<button type="button" class="${ds===fDate?'sel ':''}${ds===ts?'today ':''}${dt.getDay()===0?'sun':''}" data-v="${ds}" aria-label="${dateText(ds)}">${d}</button>`}
  picker.innerHTML=`<div class="pkHead"><button type="button" data-pk="prev" aria-label="이전 달">${ARW('M10 3 5 8l5 5')}</button><b>${y}년 ${m+1}월</b><button type="button" data-pk="next" aria-label="다음 달">${ARW('m6 3 5 5-5 5')}</button></div><div class="pkWeek">${WD.map(w=>`<span>${w}</span>`).join('')}</div><div class="pkGrid">${g}</div><div class="pkFoot"><button type="button" data-pk="none">날짜 없음</button><button type="button" data-pk="today">오늘</button></div>`;
}
function placePicker(){const r=$('fDateBtn').getBoundingClientRect(),w=picker.offsetWidth,h=picker.offsetHeight;const x=Math.min(Math.max(8,r.left),innerWidth-w-8);let y=r.top-h-6;if(y<8)y=Math.min(r.bottom+6,innerHeight-h-8);picker.style.left=x+'px';picker.style.top=y+'px'}
function closePicker(){if(!pk)return;pk=null;picker.hidden=true;$('fDateBtn').setAttribute('aria-expanded','false')}
$('fDateBtn').onclick=()=>{
  if(pk){closePicker();return}
  const base=fDate?new Date(fDate+'T00:00'):new Date();pk={y:base.getFullYear(),m:base.getMonth()};
  $('sheet').appendChild(picker);drawPicker();picker.hidden=false;placePicker();$('fDateBtn').setAttribute('aria-expanded','true');
};
picker.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!pk)return;const a=b.dataset.pk;
  if(a==='prev'||a==='next'){const t=new Date(pk.y,pk.m+(a==='prev'?-1:1),1);pk.y=t.getFullYear();pk.m=t.getMonth();drawPicker();placePicker();return}
  fDate=a==='none'?'':a==='today'?todayStr():b.dataset.v;showDate();closePicker();
});
document.addEventListener('pointerdown',e=>{if(pk&&!picker.contains(e.target)&&!$('fDateBtn').contains(e.target))closePicker()},true);

/* ---------- 추가·고치기 ---------- */
let editId=null,fType='out';
function setType(t){fType=t;document.querySelectorAll('.typeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))}
function openSheet(type,row){
  editId=row?row.id:null;setType(row?row.type:type);
  $('fAmt').value=row?row.amount.toLocaleString('ko-KR'):'';$('fMemo').value=row?row.memo||'':'';
  fDate=row?row.date||'':todayStr();showDate();
  $('sheetTitle').textContent=row?'고치기':(type==='in'?'수입 추가':'지출 추가');
  $('fDel').hidden=!row;
  $('sheet').showModal();setTimeout(()=>$('fAmt').focus(),50);
}
function closeSheet(){closePicker();$('sheet').close()}
document.querySelector('.typeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){setType(b.dataset.t);if(!editId)$('sheetTitle').textContent=b.dataset.t==='in'?'수입 추가':'지출 추가'}});
$('fAmt').addEventListener('input',()=>{const n=num($('fAmt').value);$('fAmt').value=n?n.toLocaleString('ko-KR'):''});
$('quick').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const q=Number(b.dataset.q);$('fAmt').value=q?(num($('fAmt').value)+q).toLocaleString('ko-KR'):''});
document.querySelector('.memoChips').addEventListener('click',e=>{const b=e.target.closest('[data-memo]');if(!b)return;$('fMemo').value=b.dataset.memo;if(b.dataset.memo.includes('이월')){fDate='';showDate()}});
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openSheet(b.dataset.add));
['listIn','listOut'].forEach(id=>$(id).addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const r=state.rows.find(x=>x.id===b.dataset.id);if(r)openSheet(r.type,r)}));
$('fCancel').onclick=closeSheet;
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet()});
$('sheet').addEventListener('cancel',e=>{if(pk){e.preventDefault();closePicker()}});
$('fSave').onclick=()=>{
  const amount=num($('fAmt').value),memo=$('fMemo').value.trim();
  if(!amount){toast('금액을 입력해 주세요');$('fAmt').focus();return}
  if(!memo&&!fDate){toast('내용이나 날짜 중 하나는 적어 주세요');$('fMemo').focus();return}
  const r=editId&&state.rows.find(x=>x.id===editId);
  if(r)Object.assign(r,{type:fType,amount,memo,date:fDate});
  else state.rows.push({id:newId(),type:fType,amount,memo,date:fDate,at:Date.now()});
  save();render();closeSheet();toast(r?'고쳤어요':(fType==='in'?'수입을 추가했어요':'지출을 추가했어요'));
};
['fAmt','fMemo'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)$('fSave').click()}));
let delArmed=false,delT;
$('fDel').onclick=()=>{
  // 한 번 더 눌러야 지워지게 (실수 방지)
  if(!delArmed){delArmed=true;$('fDel').textContent='한 번 더 누르면 삭제';clearTimeout(delT);delT=setTimeout(()=>{delArmed=false;$('fDel').textContent='삭제'},3000);return}
  delArmed=false;$('fDel').textContent='삭제';
  state.rows=state.rows.filter(x=>x.id!==editId);save();render();closeSheet();toast('삭제했어요 (되돌리기 가능)');
};

/* ---------- 백업 ---------- */
$('menuBtn').onclick=()=>$('menu').showModal();
$('menuClose').onclick=()=>$('menu').close();
$('menu').addEventListener('click',e=>{if(e.target===$('menu'))$('menu').close()});
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('exportBtn').onclick=()=>{state.lastBackup=Date.now();write();download(`엄마-가계부-백업-${todayStr()}.json`,JSON.stringify({app:'mom-gagyebu',version:1,savedAt:new Date().toISOString(),...state},null,2),'application/json');render();toast('백업 파일을 저장했어요')};
$('csvBtn').onclick=()=>{
  const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const lines=['구분,내용,날짜,금액'];
  ['in','out'].forEach(t=>sorted(t).forEach(r=>lines.push([t==='in'?'수입':'지출',q(r.memo||''),r.date||'',r.amount].join(','))));
  lines.push('','수입 총액,,,'+total('in'),'지출 총액,,,'+total('out'),'잔액,,,'+(total('in')-total('out')));
  download(`엄마-가계부-${todayStr()}.csv`,'﻿'+lines.join('\n'),'text/csv');toast('CSV 파일을 저장했어요');
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const p=JSON.parse(await f.text());if(!Array.isArray(p.rows))throw 0;
    if(!confirm(`백업 파일의 ${p.rows.length}줄로 지금 내용을 바꿀까요?`))return;
    state.rows=p.rows;save();render();$('menu').close();toast('백업을 불러왔어요')}
  catch(err){toast('엄마 가계부 백업 파일이 아니에요')}
});
$('pdfBtn').onclick=()=>{const t=document.title;document.title=`엄마 가계부 ${todayStr()}`;setTimeout(()=>{print();document.title=t},50)};

/* ---------- 시작 ---------- */
load();last=snap();render();
</script>
</body>
</html>
