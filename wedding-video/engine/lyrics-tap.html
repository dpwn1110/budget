<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가사 타이밍 탭</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --bg:#1d1a17; --panel:#2a2622; --ink:#f3ece2; --muted:#a99d8f; --accent:#d9a77e; --done:#8fb59a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Inter", system-ui, sans-serif; }
  main { max-width:980px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font:400 26px "Cormorant Garamond", serif; margin:0 0 6px; }
  .muted { color:var(--muted); font-size:13px; }
  .stage { background:var(--panel); border-radius:10px; padding:28px 24px; margin:16px 0; text-align:center; }
  #now { font:400 40px "Cormorant Garamond", serif; min-height:56px; }
  #next { color:var(--muted); font-size:18px; margin-top:8px; min-height:28px; }
  #clock { font:500 15px "Inter"; color:var(--accent); margin-bottom:10px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:10px 0; }
  label.file, button { background:#3a342e; color:var(--ink); border:1px solid #4a433b; border-radius:6px;
    padding:8px 14px; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); color:#2a1d12; border-color:var(--accent); font-weight:500; }
  input[type=file] { display:none; }
  kbd { background:#3a342e; border:1px solid #4a433b; border-bottom-width:2px; border-radius:4px; padding:1px 6px; font-size:12px; }
  ol { padding-left:36px; margin:0; }
  li { padding:3px 6px; border-radius:4px; cursor:pointer; }
  li:hover { background:#332e29; }
  li.cur { background:#4a3a2c; }
  li .t { display:inline-block; width:74px; color:var(--done); font-variant-numeric:tabular-nums; }
  li .t.empty { color:#5b534a; }
  li .bg { color:var(--muted); font-style:italic; }
  textarea { width:100%; height:140px; background:#14120f; color:var(--ink); border:1px solid #4a433b; border-radius:6px; font:12px monospace; padding:8px; }
</style>
</head>
<body>
<main>
  <h1>가사 타이밍 탭</h1>
  <div class="muted">
    노래를 틀고, 각 줄을 <b>부르기 시작하는 순간</b>에 <kbd>Space</kbd>를 누르세요.
    노래가 멈추는 구간(간주)에서는 <kbd>E</kbd>로 앞 줄을 끝내세요.
    <kbd>Backspace</kbd> 한 줄 되돌리기 · <kbd>←</kbd><kbd>→</kbd> 3초 이동 · <kbd>P</kbd> 재생/멈춤 · 목록의 줄을 누르면 그 줄 2초 전부터 다시 탭.
  </div>

  <div class="row">
    <label class="file">노래 파일 고르기<input id="audio" type="file" accept="audio/*"></label>
    <button id="play">▶ 재생 (P)</button>
    <button id="slow">속도 1.0×</button>
    <span id="file" class="muted"></span>
  </div>

  <div class="stage">
    <div id="clock">0:00.00</div>
    <div id="now">노래 파일을 고르세요</div>
    <div id="next"></div>
  </div>

  <ol id="list"></ol>

  <h3>결과</h3>
  <div class="muted">다 끝나면 아래 글자를 전부 복사해서 채팅에 붙여 넣어 주세요. 이 창을 닫아도 브라우저에 저장됩니다.</div>
  <div class="row"><button id="copy" class="primary">결과 복사</button><button id="reset">처음부터</button></div>
  <textarea id="out" readonly></textarea>
</main>
<script src="lyrics.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const audio = new Audio();
  const N = LYRICS.length;
  // marks[i] = {start, end}. end가 없으면 다음 줄 시작까지.
  let marks = [];
  try { marks = JSON.parse(localStorage.getItem("lyricMarks") || "[]"); } catch {}
  let cur = marks.findIndex((m) => !m || m.start == null);
  if (cur < 0) cur = marks.length;
  const fmt = (s) => s == null ? "–" : `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, "0")}`;

  function save() {
    try { localStorage.setItem("lyricMarks", JSON.stringify(marks)); } catch {}
    $("out").value = LYRICS.map((l, i) => {
      const m = marks[i] || {};
      return `${i + 1}\t${m.start != null ? m.start.toFixed(2) : ""}\t${m.end != null ? m.end.toFixed(2) : ""}\t${l}`;
    }).join("\n");
  }
  function renderList() {
    $("list").innerHTML = "";
    LYRICS.forEach((l, i) => {
      const li = document.createElement("li");
      const m = marks[i];
      li.innerHTML = `<span class="t ${m && m.start != null ? "" : "empty"}">${fmt(m && m.start)}</span>` +
        `<span class="${l.startsWith("(") ? "bg" : ""}">${l}</span>` + (m && m.end != null ? ` <span class="muted">· 끝 ${fmt(m.end)}</span>` : "");
      if (i === cur) li.className = "cur";
      li.onclick = () => {
        cur = i;
        const prev = marks[i - 1];
        audio.currentTime = Math.max(0, ((marks[i] && marks[i].start) ?? (prev && prev.start) ?? 0) - 2);
        renderList();
      };
      $("list").appendChild(li);
    });
    const el = $("list").children[cur];
    if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  function tick() {
    const t = audio.currentTime;
    $("clock").textContent = fmt(t);
    // 지금 불리는 줄: 시작이 t 이전인 마지막 줄 (end를 지났으면 비움)
    let shown = -1;
    marks.forEach((m, i) => { if (m && m.start != null && m.start <= t) shown = i; });
    const m = marks[shown];
    $("now").textContent = shown >= 0 && !(m.end != null && t > m.end) ? LYRICS[shown] : "";
    $("next").textContent = cur < N ? "다음: " + LYRICS[cur] : "끝까지 탭했어요";
    requestAnimationFrame(tick);
  }

  $("audio").onchange = (e) => {
    audio.src = URL.createObjectURL(e.target.files[0]);
    $("file").textContent = e.target.files[0].name;
    $("now").textContent = "";
  };
  const toggle = () => { if (audio.paused) audio.play(); else audio.pause(); };
  $("play").onclick = toggle;
  audio.onplay = () => ($("play").textContent = "❚❚ 멈춤 (P)");
  audio.onpause = () => ($("play").textContent = "▶ 재생 (P)");
  $("slow").onclick = () => {
    audio.playbackRate = audio.playbackRate === 1 ? 0.75 : 1;
    $("slow").textContent = `속도 ${audio.playbackRate.toFixed(2)}×`;
  };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "TEXTAREA") return;
    const t = audio.currentTime;
    if (e.code === "Space") {
      e.preventDefault();
      if (cur >= N) return;
      marks[cur] = { start: +t.toFixed(3) };
      // 다음 줄들의 시작이 이 시각보다 앞이면 지운다 (다시 탭하는 중)
      for (let j = cur + 1; j < N; j++) if (marks[j] && marks[j].start <= t) marks[j] = null;
      cur++;
    } else if (e.code === "KeyE") {
      const last = cur - 1;
      if (last >= 0 && marks[last]) marks[last].end = +t.toFixed(3);
    } else if (e.code === "Backspace") {
      e.preventDefault();
      if (cur > 0) { cur--; marks[cur] = null; audio.currentTime = Math.max(0, t - 3); }
    } else if (e.code === "ArrowLeft") audio.currentTime = Math.max(0, t - 3);
    else if (e.code === "ArrowRight") audio.currentTime = t + 3;
    else if (e.code === "KeyP") toggle();
    else return;
    save();
    renderList();
  });
  $("copy").onclick = () => { $("out").select(); navigator.clipboard?.writeText($("out").value); $("copy").textContent = "복사됨"; };
  $("reset").onclick = () => { if (confirm("탭한 시간을 모두 지울까요?")) { marks = []; cur = 0; audio.currentTime = 0; save(); renderList(); } };
  save();
  renderList();
  tick();
</script>
</body>
</html>
